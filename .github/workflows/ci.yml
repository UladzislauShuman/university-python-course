name: Python CI for Lab 2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lab2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with pytest
        run: |
          pytest

  build-exe:
    runs-on: windows-latest
    needs: test  # сборка выполняется только если тесты прошли
    defaults:
      run:
        working-directory: ./lab2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile lab/main.py
          # Если нужно включить папку data, можно добавить:
          # pyinstaller --onefile --add-data "data;data" main.py


      - name: List files in the workspace
        run: |
          dir /s
        shell: cmd
      
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab2-exe
          path: ${{ github.workspace }}/lab2/dist/main.exe
